name: ALKiln tests
on:
  push:
    branches:
      - kiln-tests-lemon
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        uses: SuffolkLITLab/ALKiln@v1
        with:
          CONFIG_CONTENTS: ${{ secrets.CONFIG_CONTENTS }}
